name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install CPU tensor runtime for audio regression tests
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      # This validator includes JS/Python EQ parity, which requires NumPy.
      - name: Validate release structure and frontend
        run: python scripts/validate_release.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
