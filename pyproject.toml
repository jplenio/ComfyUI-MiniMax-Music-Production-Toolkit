[project]
name = "comfyui-minimax-music-production-toolkit"
version = "3.1.1"
description = "ComfyUI music production with YuE2 audio cover versions, SheetSage2 score-aware prompts, YuE2 and MiniMax Music 3 song generation, restoration, mastering, artwork and release metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Johannes Plenio" }
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.10",
  "soundfile>=0.12",
  "imageio-ffmpeg>=0.5",
  "mutagen>=1.47",
  "Pillow>=10.0"
]

[project.optional-dependencies]
# Original-lyrics transcription for YuE2 covers. Optional on purpose: it is
# only needed by the "original lyrics" cover mode and must not be forced on
# users who never use it. See requirements-whisper.txt for the same install.
whisper = [
  "faster-whisper>=1.0"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio"
]

[project.urls]
Repository = "https://github.com/jplenio/ComfyUI-MiniMax-Music-Production-Toolkit"
Documentation = "https://github.com/jplenio/ComfyUI-MiniMax-Music-Production-Toolkit#readme"
"Bug Tracker" = "https://github.com/jplenio/ComfyUI-MiniMax-Music-Production-Toolkit/issues"

[tool.comfy]
PublisherId = "jplenio"
DisplayName = "Music Production Toolkit"
Icon = "https://raw.githubusercontent.com/jplenio/ComfyUI-MiniMax-Music-Production-Toolkit/main/assets/branding/icon.png"
Banner = "https://raw.githubusercontent.com/jplenio/ComfyUI-MiniMax-Music-Production-Toolkit/main/assets/branding/banner.png"
